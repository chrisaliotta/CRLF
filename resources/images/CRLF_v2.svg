<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
  <title id="title">CRLF_ terminal application icon</title>
  <desc id="desc">Editable vector reconstruction of the approved icon: a dark rounded terminal tile, silver frame, white outlined CRLF lettering and an icy blue underscore cursor. Transparent outside the tile.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.85" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#2b2d33"/><stop offset="0.2" stop-color="#15171d"/><stop offset="0.55" stop-color="#0c0e13"/><stop offset="1" stop-color="#17191e"/>
    </linearGradient>
    <radialGradient id="face" cx="0.35" cy="0.13" r="1.1">
      <stop offset="0" stop-color="#1b1d24"/><stop offset="0.55" stop-color="#0c0e13"/><stop offset="1" stop-color="#101218"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#51545b" stop-opacity="0.7"/><stop offset="0.22" stop-color="#25282f" stop-opacity="0.3"/><stop offset="0.68" stop-color="#050608" stop-opacity="0.8"/><stop offset="1" stop-color="#3a3d44" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bfc3cd"/><stop offset="0.52" stop-color="#858a96"/><stop offset="1" stop-color="#9ba0aa"/></linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#fcfcff"/><stop offset="1" stop-color="#e9ebf2"/></linearGradient>
    <linearGradient id="cursor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b8edff"/><stop offset="1" stop-color="#8cdbf8"/></linearGradient>
    <filter id="glow" x="-0.5" y="-1.5" width="2" height="4"><feGaussianBlur stdDeviation="13"/></filter>
  </defs>
  <g id="terminal-tile">
    <rect x="15" y="22" width="1224" height="1215" rx="244" fill="url(#tile)" stroke="#25272d" stroke-width="2"/>
    <rect x="27" y="34" width="1200" height="1191" rx="232" fill="none" stroke="url(#edge)" stroke-width="11"/>
    <rect x="79" y="105" width="1092" height="1055" rx="128" fill="url(#face)" stroke="url(#frame)" stroke-width="7"/>
    <path d="M81 290 H1169" fill="none" stroke="url(#frame)" stroke-width="6"/>
  </g>
